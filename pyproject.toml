[project]
name = "pywr-editor"
version = "2.1.1"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jsonschema==4.26.0",
    "matplotlib==3.7.2",
    "numpy==1.26.4",
    "openpyxl>=3.1.5",
    "pandas==2.2.0",
    "pyproj==3.6.1",
    "pyqtgraph==0.13.3",
    "pyshp==2.3.1",
    "pyside6==6.6.2",
    "pywin32==306 ; sys_platform == 'win32'",
    "pywr==1.23.0",
    "qtawesome==1.3.0",
    "qtconsole>=5.7.2",
    "scipy==1.12.0",
    "setuptools==69.1.0",
    "shiboken6==6.6.2",
    "tables==3.10.1",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest_ini_options]
testpaths = ["test"]
required_plugins = ["pytest-qt"]
qt_api = "pyside6"

[tool.bumpver]
current_version = "2.1.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"pywr_editor/__init__.py" = [
    '^__version__ = "{version}"$',
    '^__build_date__ = "YYYY-MM-DD"$',
]
"windows_setup.iss" = [
    "#define MyAppVersion \"{version}\""
]

[tool.isort]
profile = "black"
line_length = 88
# some imports have different priorities (see form module)
skip = ["__init__.py", "venv", "venv310"]

[dependency-groups]
dev = [
    "black==24.2.0",
    "bumpver==2023.1129",
    "flake8==7.0.0",
    "flake8-black>=0.5.0",
    "flake8-isort==6.1.1",
    "isort==5.13.2",
    "pre-commit==3.6.1",
    "pyinstaller==6.4.0",
    "pytest==8.0.1",
    "pytest-cov==4.1.0",
    "pytest-qt==4.4.0",
    "requests==2.31.0",
    "typer>=0.29.1",
]

